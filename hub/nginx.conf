server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # the proxy in front maps the domain to port 3000; never leak the container port in redirects
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/json application/javascript text/javascript application/xml image/svg+xml;

    # hashed build output: cache for a year
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # always revalidate
    location ~* \.html$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location = /payment-config.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location = /sitemap.xml {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # / and /ar/ (dist/ar/index.html); plain 404 for anything else
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache";
    }
}
