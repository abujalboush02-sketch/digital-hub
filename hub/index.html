<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!--seo-->
  <meta name="theme-color" content="#0d0c0b">
  <script>
    // Set theme + language before first paint (no flash).
    (function () {
      try {
        var th = localStorage.getItem('theme');
        if (th !== 'light' && th !== 'dark') th = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = th;
        var l = localStorage.getItem('lang');
        if (l !== 'ar' && l !== 'en') l = window.__DEFAULT_LANG || (navigator.language || 'en').toLowerCase().indexOf('ar') === 0 ? 'ar' : 'en';
        document.documentElement.lang = l; document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
      } catch (e) {}
    })();
  </script>
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <a class="skip" href="#top" data-i18n="skip">Skip to content</a>
  <!--include:nav-->
  <main id="top">
    <section class="hero" aria-labelledby="h1">
      <div class="hero__copy">
        <span class="hero__kicker mono" data-i18n="hero.kicker">Software · AI · Automation · Growth</span>
        <h1 id="h1" data-i18n="hero.h1">I build the systems businesses run on.</h1>
        <p class="hero__sub" data-i18n="hero.sub">Full-stack engineering, AI agents written from scratch, and automation that removes the busywork. Across every industry I have worked in.</p>
      </div>
      <div class="net" id="network" role="group" data-i18n-aria="net.label" aria-label="Capability network">
        <canvas class="net__canvas" aria-hidden="true"></canvas>
        <div class="net__nodes"></div>
        <div class="net__read" aria-live="polite"></div>
      </div>
    </section>

    <div id="craft"></div>
    <div id="work"></div>
    <div id="products"></div>
    <div id="agents"></div>
    <div id="industries"></div>
    <div id="think"></div>
    <div id="trust"></div>
    <div id="racing"></div>
    <div id="contact"></div>
  </main>
  <!--include:footer-->
</body>
</html>
