<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketplace — Coming Soon | M. Abu Jalboush</title>
<meta name="description" content="Production-ready software templates, SaaS architectures and automation workflows. Launching soon. Join the list to be notified.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--bg:#020617;--panel:rgba(15,23,42,.6);--line:rgba(255,255,255,.08);--text:#f1f5f9;--muted:#94a3b8;--accent:#38bdf8}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg) radial-gradient(circle at 15% 40%,rgba(56,189,248,.08),transparent 30%),radial-gradient(circle at 85% 70%,rgba(129,140,248,.07),transparent 30%);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif}
  html[lang=ar] body{font-family:'IBM Plex Sans Arabic',sans-serif}
  main{width:100%;max-width:520px;text-align:center}
  .tag{display:inline-block;font:400 11px 'JetBrains Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);border:1px solid rgba(56,189,248,.3);padding:6px 12px;border-radius:999px;margin-bottom:24px}
  h1{font-size:clamp(2rem,6vw,3rem);line-height:1.1;margin:0 0 16px;font-weight:800;letter-spacing:-.03em}
  p.lead{color:var(--muted);line-height:1.7;margin:0 0 32px}
  form{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px;text-align:start;backdrop-filter:blur(12px)}
  label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px}
  label:first-child{margin-top:0}
  input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);font:inherit}
  input:focus{outline:2px solid var(--accent);outline-offset:1px}
  button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:var(--accent);color:#04131f;font:inherit;font-weight:800;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  .msg{margin-top:14px;font-size:14px;min-height:20px}.ok{color:#34d399}.err{color:#f87171}
  .links{margin-top:28px;display:flex;gap:20px;justify-content:center;font-size:14px}
  .links a{color:var(--muted);text-decoration:none}.links a:hover{color:var(--text)}
  .lang{position:fixed;top:16px;inset-inline-end:16px;background:none;border:1px solid var(--line);color:var(--muted);width:auto;margin:0;padding:6px 12px;border-radius:999px;font-size:13px}
  .hp{position:absolute;left:-9999px;opacity:0}
</style>
</head>
<body>
<button class="lang" id="lang" type="button">العربية</button>
<main>
  <span class="tag" data-t="tag">Marketplace · Coming soon</span>
  <h1 data-t="h1">Digital tools built for performance.</h1>
  <p class="lead" data-t="lead">Production-ready codebases, SaaS architectures and automation workflows are on the way. Leave your details and we will tell you the moment the marketplace opens.</p>
  <form id="f" novalidate>
    <label for="n" data-t="name">Name</label>
    <input id="n" autocomplete="name">
    <label for="e" data-t="email">Email</label>
    <input id="e" type="email" autocomplete="email" required>
    <label for="p" data-t="wa">WhatsApp (optional)</label>
    <input id="p" type="tel" autocomplete="tel" dir="ltr">
    <input class="hp" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button id="b" type="submit" data-t="cta">Notify me</button>
    <div class="msg" id="m" role="status"></div>
  </form>
  <div class="links">
    <a href="https://mohammad-abujalboush.com" data-t="home">Home</a>
    <a href="https://portfolio.mohammad-abujalboush.com" data-t="pf">Portfolio</a>
    <a href="https://wa.me/962776110639" data-t="contact">WhatsApp</a>
  </div>
</main>
<script>
(function(){
  var T={
    en:{tag:"Marketplace · Coming soon",h1:"Digital tools built for performance.",lead:"Production-ready codebases, SaaS architectures and automation workflows are on the way. Leave your details and we will tell you the moment the marketplace opens.",name:"Name",email:"Email",wa:"WhatsApp (optional)",cta:"Notify me",home:"Home",pf:"Portfolio",contact:"WhatsApp",ok:"You are on the list. We will be in touch.",bad:"Please enter a valid email.",fail:"Something went wrong. Please try again.",btn:"العربية"},
    ar:{tag:"المتجر · قريباً",h1:"أدوات رقمية مصممة للأداء.",lead:"أكواد جاهزة للإنتاج، وهياكل SaaS، وسير عمل أتمتة في الطريق. اترك بياناتك وسنخبرك فور افتتاح المتجر.",name:"الاسم",email:"البريد الإلكتروني",wa:"واتساب (اختياري)",cta:"أبلغني",home:"الرئيسية",pf:"الأعمال",contact:"واتساب",ok:"تم تسجيلك في القائمة. سنتواصل معك.",bad:"يرجى إدخال بريد إلكتروني صحيح.",fail:"حدث خطأ. يرجى المحاولة مرة أخرى.",btn:"English"}
  };
  var lang="en";
  try{var s=localStorage.getItem("mk.lang");if(s==="ar"||s==="en")lang=s;else if((navigator.language||"").toLowerCase().indexOf("ar")===0)lang="ar";}catch(e){if((navigator.language||"").toLowerCase().indexOf("ar")===0)lang="ar";}
  function apply(){
    document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
    document.querySelectorAll("[data-t]").forEach(function(el){el.textContent=T[lang][el.getAttribute("data-t")];});
    document.getElementById("lang").textContent=T[lang].btn;
    document.title=lang==="ar"?"المتجر — قريباً | م. أبو جلبوش":"Marketplace — Coming Soon | M. Abu Jalboush";
  }
  document.getElementById("lang").onclick=function(){lang=lang==="en"?"ar":"en";try{localStorage.setItem("mk.lang",lang);}catch(e){}apply();};
  apply();
  var sb=window.supabase.createClient("https://dvlabpioxtyyzvhzpmyc.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2bGFicGlveHR5eXp2aHpwbXljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM1MDY4NzUsImV4cCI6MjA4OTA4Mjg3NX0.fBM9r7WXpntVUM-qsBDQFlknRf2vMyIpJTp5ww9pzUM");
  document.getElementById("f").addEventListener("submit",async function(ev){
    ev.preventDefault();
    var m=document.getElementById("m"),b=document.getElementById("b"),email=document.getElementById("e").value.trim();
    m.className="msg";m.textContent="";
    if(document.getElementById("hp").value)return;
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){m.className="msg err";m.textContent=T[lang].bad;return;}
    b.disabled=true;
    try{
      var r=await sb.from("waitlist").insert([{name:document.getElementById("n").value.trim(),email:email,phone:document.getElementById("p").value.trim(),source:"marketplace"}]);
      if(r.error)throw r.error;
      m.className="msg ok";m.textContent=T[lang].ok;document.getElementById("f").reset();
    }catch(e){console.error(e);m.className="msg err";m.textContent=T[lang].fail;}
    b.disabled=false;
  });
})();
</script>
</body>
</html>
