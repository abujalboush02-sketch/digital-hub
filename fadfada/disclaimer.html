                const el = document.getElementById(id);
                if(el) {
                    el.style.opacity = '0';
                    setTimeout(() => {
                        el.innerHTML = t[id];
                        el.style.opacity = '1';
                    }, 200);
                }
            });

            document.querySelectorAll('[id^="btn-"]').forEach(btn => {
                btn.style.fontWeight = '400'; btn.style.color = 'inherit';
            });
            const activeBtn = document.getElementById(`btn-${lang}`);
            if(activeBtn) {
                activeBtn.style.fontWeight = '600'; activeBtn.style.color = '#C47A6C';
            }

            localStorage.setItem('fadfada_lang', lang);
